/* ───────── 左：100 格方阵，一格 = 1% 权重 ─────────
   和封面不同：封面是 5 块按面积拼，这里是 100 个同样大的格子按行数数。
   VOC 4 行（40 格）、CEO 提效 2 行、场景挖掘 2 行 —— 前 8 行 = 80%；
   空一道缝，下面专利 1 行、星际圈 1 行。
   格 72、间距 8；第 r 行 top = 96 + 80r（第 8 行起再加 64 的缝）。
   形状沿用封面：VOC/场景 方块，CEO/星际圈 四分之一圆，专利 圆 */
@keyframes pop { from { transform: scale(0); } }
.c { position: absolute; width: 72px; height: 72px; }
.c.anim { animation: pop 360ms var(--ease-out); }
.voc  { background: var(--red); }
.ceo  { background: var(--ink); border-top-right-radius: 100%; }
.scn  { background: var(--yellow); }
.pat  { background: var(--blue); border-radius: 50%; }
.star { background: var(--ink); border-top-right-radius: 100%; }

/* 80% 分界线 */
.cut { position: absolute; left: 96px; top: 758px; width: 456px; height: 4px; background: var(--ink); transform-origin: 0 50%; }
.cut.anim { animation: draw-x 420ms var(--ease-out) 760ms; }
.cutlab { position: absolute; left: 576px; top: 728px; width: 312px; height: 64px; justify-content: flex-end; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.cutlab .t { font-size: var(--fs-body-s); font-weight: 700; }
.cutlab .n { font-size: 44px; font-weight: 900; line-height: 1; letter-spacing: -.01em; }
.cutlab.anim { animation: reveal-right 420ms var(--ease-out) 860ms; }

/* 每个目标的说明：权重 + 名字 + 指标个数（小形个数 = 指标数） */
.lb { position: absolute; left: 920px; width: 266px; display: flex; flex-direction: column; justify-content: center; }
.lb .w  { font-weight: 900; line-height: 1; letter-spacing: -.01em; }
.lb .nm { font-size: 26px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.lb .ks { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: var(--fs-body-s); font-weight: 500; white-space: nowrap; }
.lb .ks i { flex: 0 0 22px; height: 22px; }
.lb .ks i.sq  { background: var(--c); }
.lb .ks i.fan { background: var(--c); border-top-right-radius: 100%; }
.lb .ks i.cir { background: var(--c); border-radius: 50%; }
.lb .ks span { margin-left: 6px; }
.lb.anim { animation: reveal-right 420ms var(--ease-out); }
.lb .row1 { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }

.lb-voc  { top: 96px;  height: 312px; --c: var(--red); }
.lb-voc .w { font-size: 120px; color: var(--red); margin-bottom: 10px; }
.lb-ceo  { top: 416px; height: 152px; --c: var(--ink); }
.lb-scn  { top: 576px; height: 152px; --c: var(--yellow); }
.lb-ceo .w, .lb-scn .w { font-size: var(--fs-num-l); margin-bottom: 4px; }
.lb-pat  { top: 792px; height: 72px; --c: var(--blue); }
.lb-star { top: 872px; height: 72px; --c: var(--ink); }
.lb-pat .w, .lb-star .w { font-size: 34px; }
.lb-pat .nm, .lb-star .nm { font-size: var(--fs-body-s); }
.lb-pat .ks, .lb-star .ks { margin-top: 4px; }
.lb-pat .ks i, .lb-star .ks i { flex-basis: 20px; height: 20px; }

/* ───────── 右：竖排标题 + 信息块 ───────── */
.vt { position: absolute; left: 1236px; top: 80px; writing-mode: vertical-rl;
      font-family: var(--serif); font-weight: 900; font-size: var(--fs-title-2); line-height: 1.2; letter-spacing: .06em; }
.vt .l { display: block; }
.vt .l.anim { animation: reveal-down 560ms var(--ease-out); }
.vt .l:nth-child(2) { animation-delay: 140ms !important; }
.tcy { text-combine-upright: all; }
.up  { text-orientation: upright; }

.info { position: absolute; left: 1500px; top: 84px; width: 324px; }
.info section + section { margin-top: 48px; }
.info .tag { margin-bottom: 14px; }
.info .txt-s { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.6; }
.info section.anim { animation: reveal-right 520ms var(--ease-out); }
.info section:nth-child(1) { animation-delay: 420ms !important; }
.info section:nth-child(2) { animation-delay: 540ms !important; }

.src { position: absolute; left: 1236px; bottom: 107px; width: 588px; font-size: var(--fs-body-s); font-weight: 500; color: var(--ink-2); letter-spacing: .04em; line-height: 1.5; }
.src.anim { animation: reveal-right 500ms var(--ease-out) 1000ms; }
.page-rule { left: 96px; right: 96px; top: 1008px; transform-origin: 0 50%; }
.page-rule.anim { animation: draw-x 600ms var(--ease-out) 940ms; }
