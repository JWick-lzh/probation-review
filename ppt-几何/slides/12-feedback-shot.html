<!DOCTYPE html>
<html lang="zh-CN" data-total="1700" data-probe="双周汇报期份都在一个系统里工作反馈名单人月的版本到需求当天交付 CEO 上午提年度和员筛选下午加了时间管理口径库取提交情况页第期姓名已打码述职报告截图">
<head>
<meta charset="UTF-8">
<title>12 工作反馈系统截图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@900&display=swap"></noscript>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
/* ───────── 左：墨黑平涂画框（CEO 提效）+ 截图 ─────────
   截图 1327×1045 偏竖，按原比例放 718 × 565.4（和第 5 页截图同高），画框跟着收窄，不裁 */
.frame { position: absolute; left: 96px; top: 80px; width: 782px; background: var(--ink); }
.frame .shot { display: block; margin: 32px 32px 0; width: 718px; height: 565.4px; object-fit: contain; background: #fff; }
.frame .cap { height: 64px; display: flex; align-items: center; padding: 0 32px; font-size: var(--fs-label); font-weight: 500; color: var(--paper); letter-spacing: .04em; white-space: nowrap; }
.frame.anim { animation: drop 720ms var(--spring); --drop: -820px; }

/* ───────── 左下：一排关键数 ───────── */
.row { position: absolute; left: 96px; top: 790px; width: 1064px; display: grid; grid-template-columns: 1fr 1fr 1.1fr; column-gap: 48px; }
.row .tag { margin-bottom: 12px; }
.row .n { font-size: var(--fs-num-l); font-weight: 900; line-height: 1; letter-spacing: -.01em; white-space: nowrap; }
.row .n small { font-size: var(--fs-body); font-weight: 700; margin-left: 8px; letter-spacing: 0; }
.row .sub { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.5; margin-top: 12px; }
.row .txt { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.6; }
.row > div.anim { animation: reveal-right 520ms var(--ease-out); }
.row > div:nth-child(1) { animation-delay: 480ms !important; }
.row > div:nth-child(2) { animation-delay: 580ms !important; }
.row > div:nth-child(3) { animation-delay: 680ms !important; }
/* 20 个版本 = 20 个小方块（CEO 提效 墨黑） */
.vers { display: flex; gap: 4px; margin-top: 14px; }
.vers i { flex: 0 0 11px; height: 22px; background: var(--ink); }
@keyframes pop { from { transform: scaleY(0); } }
.vers i.anim { animation: pop 260ms var(--ease-out); transform-origin: 50% 100%; }

/* ───────── 右：竖排断言标题 ───────── */
.vt { position: absolute; left: 1236px; top: 80px; writing-mode: vertical-rl;
      font-family: var(--serif); font-weight: 900; font-size: var(--fs-title-2); line-height: 1.2; letter-spacing: .06em; }
.vt .l { display: block; }
.vt .l.anim { animation: reveal-down 560ms var(--ease-out); }
.vt .l:nth-child(2) { animation-delay: 140ms !important; }
.vt .l:nth-child(3) { animation-delay: 280ms !important; }
.tcy { text-combine-upright: all; }
.up  { text-orientation: upright; letter-spacing: 0; }

.src { position: absolute; left: 1236px; bottom: 107px; width: 588px; font-size: var(--fs-body-s); font-weight: 500; color: var(--ink-2); letter-spacing: .04em; line-height: 1.5; }
.src.anim { animation: reveal-right 500ms var(--ease-out) 1000ms; }
.page-rule { left: 96px; right: 96px; top: 1008px; transform-origin: 0 50%; }
.page-rule.anim { animation: draw-x 600ms var(--ease-out) 940ms; }
</style>
</head>
<body>

  <figure class="frame anim">
    <img class="shot" src="../assets/feedback-shot.png" alt="工作反馈系统「提交情况」页，第 2 期，截止 9 月 26 日 18:00：没交 0 人，迟交 3 人，下面是按部门的没交、迟交人数和提交名单；姓名和部门已打码">
    <figcaption class="cap">「提交情况」页，第 2 期，姓名已打码</figcaption>
  </figure>

  <div class="row">
    <div class="anim">
      <span class="tag">双周汇报 4 期</span>
      <div class="n"><span data-to="105" data-delay="480" data-dur="640">105</span><small>份</small></div>
      <p class="sub">名单 26 人</p>
    </div>
    <div class="anim">
      <span class="tag">一个月的版本</span>
      <div class="n"><span data-to="20" data-delay="580" data-dur="560">20</span><small>个</small></div>
      <div class="vers" aria-label="20 个版本">
        <i class="anim" style="animation-delay:600ms"></i><i class="anim" style="animation-delay:620ms"></i><i class="anim" style="animation-delay:640ms"></i><i class="anim" style="animation-delay:660ms"></i><i class="anim" style="animation-delay:680ms"></i><i class="anim" style="animation-delay:700ms"></i><i class="anim" style="animation-delay:720ms"></i><i class="anim" style="animation-delay:740ms"></i><i class="anim" style="animation-delay:760ms"></i><i class="anim" style="animation-delay:780ms"></i><i class="anim" style="animation-delay:800ms"></i><i class="anim" style="animation-delay:820ms"></i><i class="anim" style="animation-delay:840ms"></i><i class="anim" style="animation-delay:860ms"></i><i class="anim" style="animation-delay:880ms"></i><i class="anim" style="animation-delay:900ms"></i><i class="anim" style="animation-delay:920ms"></i><i class="anim" style="animation-delay:940ms"></i><i class="anim" style="animation-delay:960ms"></i><i class="anim" style="animation-delay:980ms"></i>
      </div>
      <p class="sub">9/23 V1.0 到 10/24 V2.11</p>
    </div>
    <div class="anim">
      <span class="tag">需求当天交付</span>
      <p class="txt">10/22 CEO 上午提<br>年度和人员筛选<br>下午交付<br>10/19 加了时间管理</p>
    </div>
  </div>

  <!-- 断言标题：双周汇报：4 期 105 份，都在一个系统里（三位数直立排） -->
  <h1 class="vt" aria-label="双周汇报：4 期 105 份，都在一个系统里"><span class="l anim">双周汇报</span><span class="l anim"><span class="tcy">4</span>期<span class="up">105</span>份</span><span class="l anim">都在一个系统里</span></h1>

  <div class="src anim">口径：工作反馈系统线上库；版本取 git；截图取自述职报告</div>
  <div class="rule page-rule anim"></div>

<script src="../shared/motion.js"></script>
</body>
</html>
