<!DOCTYPE html>
<html lang="zh-CN" data-total="1700" data-probe="会议这条线连成了闭环用智能体起来前材料评审约时间预约后自动推送打分直接的好处业务助理开准备工作少顺带变化更熟练地开始搭自己台左边就是页和请填写截图口径中人名已换成岗位">
<head>
<meta charset="UTF-8">
<title>11 会议闭环</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@900&display=swap"></noscript>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
/* ───────── 左：墨黑平涂画框 + 截图 ─────────
   截图 1444×1164，按原比例放 923 × 744，不裁 */
.frame { position: absolute; left: 96px; top: 80px; width: 987px; background: var(--ink); }
.frame .shot { display: block; margin: 32px 32px 0; width: 923px; height: 744px; object-fit: contain; background: #fff; }
.frame .cap { height: 64px; display: flex; align-items: center; padding: 0 32px; font-size: var(--fs-label); font-weight: 500; color: var(--paper); letter-spacing: .04em; }
.frame.anim { animation: drop 720ms var(--spring); --drop: -960px; }

/* ───────── 右：竖排标题 ───────── */
.vt { position: absolute; left: 1133px; top: 80px; writing-mode: vertical-rl;
      font-family: var(--serif); font-weight: 900; font-size: var(--fs-title-2); line-height: 1.2; letter-spacing: .06em; }
.vt .l { display: block; }
.vt .l.anim { animation: reveal-down 560ms var(--ease-out); }
.vt .l:nth-child(2) { animation-delay: 140ms !important; }

.info { position: absolute; left: 1396px; top: 84px; width: 428px; }
.info section + section { margin-top: 44px; }
.info .tag { margin-bottom: 18px; }
.info .txt-s { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.6; }
.info section.anim { animation: reveal-right 520ms var(--ease-out); }
.info section:nth-child(1) { animation-delay: 360ms !important; }
.info section:nth-child(2) { animation-delay: 900ms !important; }
.info section:nth-child(3) { animation-delay: 1000ms !important; }

/* 闭环：三步竖排，左侧一条回线从「会后」接回「会前」 */
.loop { position: relative; height: 312px; }
.loop .back { position: absolute; left: 0; top: 34px; width: 34px; height: 240px; border: 3px solid var(--ink); border-right: 0; transform-origin: 100% 50%; }
.loop .back.anim { animation: draw-x 420ms var(--ease-out) 780ms; }
.loop .head { position: absolute; left: 25px; top: 25px; width: 0; height: 0; border-left: 14px solid var(--ink); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
.loop .spine { position: absolute; left: 66px; top: 34px; width: 3px; height: 240px; background: var(--ink); transform-origin: 50% 0; }
.loop .spine.anim { animation: grow-y 520ms var(--ease-out) 420ms; }
.step { position: absolute; left: 40px; display: flex; align-items: center; gap: 22px; }
.step i { flex: 0 0 56px; height: 56px; background: var(--ink); }
.step i.ci { border-radius: 50%; }
.step i.fa { border-top-right-radius: 100%; }
.step .w { font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); letter-spacing: .2em; line-height: 1.2; }
.step .s { font-size: var(--fs-body); font-weight: 700; line-height: 1.3; }
.step.anim { animation: reveal-right 460ms var(--ease-out); }

.src { position: absolute; left: 1133px; bottom: 107px; width: 691px; font-size: var(--fs-body-s); font-weight: 500; color: var(--ink-2); letter-spacing: .04em; line-height: 1.5; }
.src.anim { animation: reveal-right 500ms var(--ease-out) 1000ms; }
.page-rule { left: 96px; right: 96px; top: 1008px; transform-origin: 0 50%; }
.page-rule.anim { animation: draw-x 600ms var(--ease-out) 940ms; }
</style>
</head>
<body>

  <figure class="frame anim">
    <img class="shot" src="../assets/booking-007.png" alt="业务助理自己搭的约会工作台「和 007 约会请填写」：会议主题、会议说明、期望日期、参会人与分工、会议材料">
    <figcaption class="cap">业务助理自己搭的约会工作台「和 007 约会请填写」，10/26 截图</figcaption>
  </figure>

  <h1 class="vt" aria-label="会议这条线，连成了闭环"><span class="l anim">会议这条线</span><span class="l anim">连成了闭环</span></h1>

  <div class="info">
    <section class="anim">
      <span class="tag">用智能体连起来</span>
      <div class="loop" aria-label="会前材料评审，会议时间预约，会后自动推送打分，再回到会前">
        <div class="back anim"></div><div class="head"></div>
        <div class="spine anim"></div>
        <div class="step anim" style="top:6px;animation-delay:440ms"><i class="sq"></i><div><div class="w">会前</div><div class="s">材料评审</div></div></div>
        <div class="step anim" style="top:126px;animation-delay:540ms"><i class="ci"></i><div><div class="w">约会</div><div class="s">会议时间预约</div></div></div>
        <div class="step anim" style="top:246px;animation-delay:640ms"><i class="fa"></i><div><div class="w">会后</div><div class="s">自动推送打分</div></div></div>
      </div>
    </section>
    <section class="anim">
      <span class="tag">直接的好处</span>
      <p class="txt-s">业务助理开会前的准备工作少了</p>
    </section>
    <section class="anim">
      <span class="tag">顺带的变化</span>
      <p class="txt-s">业务助理更熟练地用 AI，<br>开始搭自己的业务工作台<br>左边就是其中的约会页</p>
    </section>
  </div>

  <div class="src anim">口径：业务助理的约会工作台，10/26 截图；<br>截图中人名已换成岗位</div>
  <div class="rule page-rule anim"></div>

<script src="../shared/motion.js"></script>
</body>
</html>
