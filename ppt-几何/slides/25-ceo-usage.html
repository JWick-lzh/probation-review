.app { position: absolute; top: 80px; width: 468px; }
.app.a { left: 170px; }
.app.b { left: 718px; }
.app .nm { font-size: var(--fs-body); font-weight: 900; line-height: 1.3; }

.wk { position: absolute; top: 300px; display: grid; grid-template-columns: repeat(7, 60px); column-gap: 8px; font-size: var(--fs-label); font-weight: 500; color: var(--ink-2); text-align: center; }

.cal i { width: 60px; height: 60px; border: 3px solid var(--ink); }
.cal i.on { background: var(--red); border-color: var(--red); }
.cal i.nr { border: 2px dashed var(--ink-2); }
.cal.anim { animation: reveal-down 520ms var(--ease-out) 240ms; }
@keyframes pop { from { transform: scale(0); } }
.cal i.on.anim { animation: pop 320ms var(--ease-out) calc(560ms + var(--i) * 12ms); }

.mon { position: absolute; left: 96px; top: 340px; width: 66px; display: grid; grid-auto-rows: 60px; row-gap: 8px; align-items: center; font-size: var(--fs-label); font-weight: 500; color: var(--ink-2); }
.mon.anim { animation: reveal-down 520ms var(--ease-out) 240ms; }

.foot { position: absolute; top: 698px; width: 468px; font-size: var(--fs-body-s); font-weight: 500; line-height: 1.55; }
.foot b { font-weight: 900; }
.foot.anim { animation: reveal-right 480ms var(--ease-out) 820ms; }

.legend { position: absolute; left: 96px; top: 856px; list-style: none; display: flex; gap: 40px; }

.legend em { width: 30px; height: 30px; margin-right: 12px; border: 3px solid var(--ink); }
.legend em.on { background: var(--red); border-color: var(--red); }
.legend em.nr { border: 2px dashed var(--ink-2); }
.legend.anim { animation: reveal-right 480ms var(--ease-out) 900ms; }

/* ───────── 右：竖排标题 + 信息块 ───────── */
.vt { position: absolute; left: 1236px; top: 80px; writing-mode: vertical-rl;
      font-family: var(--serif); font-weight: 900; font-size: var(--fs-title-2); line-height: 1.2; letter-spacing: .06em; }
.vt .ln { display: block; }
.vt .ln.anim { animation: reveal-down 560ms var(--ease-out); }
.vt .ln:nth-child(2) { animation-delay: 140ms !important; }
.vt .ln:nth-child(3) { animation-delay: 280ms !important; }

.info { position: absolute; left: 1604px; top: 84px; width: 220px; }
.info section + section { margin-top: 52px; }
.info .tag { margin-bottom: 18px; }
.info section.anim { animation: reveal-right 520ms var(--ease-out); }
.info section:nth-child(1) { animation-delay: 420ms !important; }
.info section:nth-child(2) { animation-delay: 540ms !important; }
.info .txt { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.6; }
.ppl { display: flex; gap: 12px; margin-bottom: 14px; }
.ppl i { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--ink); }
.ppl i.dev { background: var(--ink); }

.src { position: absolute; left: 1236px; bottom: 107px; width: 588px; font-size: var(--fs-body-s); font-weight: 500; color: var(--ink-2); letter-spacing: .04em; line-height: 1.5; }
.src.anim { animation: reveal-right 500ms var(--ease-out) 1000ms; }
.page-rule { left: 96px; right: 96px; top: 1008px; transform-origin: 0 50%; }
.page-rule.anim { animation: draw-x 600ms var(--ease-out) 940ms; }
