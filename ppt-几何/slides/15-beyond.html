.kb-key .row em { flex: 0 0 26px; height: 26px; border: 4px solid var(--ink); margin-right: 12px; }
.kb-key .all { margin-top: 10px; font-size: var(--fs-body-s); font-weight: 500; line-height: 1.4; color: var(--ink-2); }
.kb-key.anim { animation: reveal-right 520ms var(--ease-out) 560ms; }

/* 方阵下：其他产出，每项用小几何形的个数表示数量 */

.more .it { display: flex; align-items: flex-start; }
.more .mk { flex: 0 0 128px; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
.more .mk b { width: 22px; height: 22px; background: var(--ink); }
.more .mk b.c { border-radius: 50%; }
.more .mk b.q { width: 34px; height: 34px; border-top-right-radius: 100%; }
.more .mk b.s { width: 34px; height: 34px; }
.more .nm { font-size: var(--fs-body-s); font-weight: 700; line-height: 1.4; }
.more .ds { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.4; color: var(--ink-2); }

.more .it:nth-child(1) { animation-delay: 760ms !important; }
.more .it:nth-child(2) { animation-delay: 820ms !important; }
.more .it:nth-child(3) { animation-delay: 880ms !important; }
.more .it:nth-child(4) { animation-delay: 940ms !important; }

/* ───────── 右：竖排标题 + 信息块（同 07） ───────── */
.vt { position: absolute; left: 1236px; top: 80px; writing-mode: vertical-rl;
      font-family: var(--serif); font-weight: 900; font-size: var(--fs-title-2); line-height: 1.2; letter-spacing: .06em; }
.vt .ln { display: block; }
.vt .ln.anim { animation: reveal-down 560ms var(--ease-out); }
.vt .ln:nth-child(2) { animation-delay: 140ms !important; }
.vt .ln:nth-child(3) { animation-delay: 280ms !important; }
.tcy { text-combine-upright: all; letter-spacing: 0; }
.tcy.lat { font-size: .84em; }   /* 竖排里的拉丁字母（IT、AI）衬线偏宽，缩一点免得顶到邻列 */

.info { position: absolute; left: 1604px; top: 84px; width: 220px; }

.info .tag { margin-bottom: 18px; }

.info section:nth-child(2) { animation-delay: 540ms !important; }
.info .lead { font-size: var(--fs-body-s); font-weight: 700; line-height: 1.5; }
.info .txt  { font-size: var(--fs-body-s); font-weight: 500; line-height: 1.6; }
.info .key { display: flex; align-items: center; font-size: var(--fs-body-s); font-weight: 500; line-height: 1.6; }
.info .key em { flex: 0 0 24px; height: 24px; margin-right: 12px; background: var(--red); }

.page-rule { left: 96px; right: 96px; top: 1008px; transform-origin: 0 50%; }
.page-rule.anim { animation: draw-x 600ms var(--ease-out) 940ms; }
