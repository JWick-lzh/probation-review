<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=Inter+Tight:wght@700..900&family=Noto+Sans+SC:wght@400;700;900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=Inter+Tight:wght@700..900&family=Noto+Sans+SC:wght@400;700;900&display=swap"></noscript>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  /* 骨架：页眉（标题＋署名）→ 左上巨数字「3」（今天讲三件事）+ 右侧三行就是这三件 → 底部细线：职位 | 试用期时间轴 */

  .masthead {
    position: absolute; left: var(--m); right: var(--m); top: 48px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .masthead h1 { font-family: var(--font-giant); font-size: var(--fs-title); font-weight: 900; line-height: 1; letter-spacing: -0.01em; }
  .masthead p { font-size: var(--fs-body); font-weight: 400; color: var(--ink); letter-spacing: 0.02em; }
  #rule-top { left: var(--m); width: var(--content-w); top: 136px; }

  /* 巨数字：字面高约 654px，顶在 180、底在 834，和右侧最后一行同底 */
  .giant {
    position: absolute; left: 66px; top: 58px;
    font-family: var(--font-giant); font-weight: 900; line-height: 1;
    font-size: 900px; letter-spacing: -0.04em; white-space: nowrap; color: var(--blue);
  }

  /* 右侧：一句引子 + 三行（三件事按讲的顺序） */
  .agenda { position: absolute; left: 744px; right: var(--m); top: 172px; }
  .agenda .lead { display: flex; justify-content: space-between; align-items: center; height: 60px; }
  .agenda .lead p { font-size: var(--fs-lead); font-weight: 700; line-height: 1.2; }
  .agenda .lead img { height: 46px; width: auto; display: block; }
  /* 三行：每行一条线起头，字挂在线下 28px；第三行字底 = 巨数字基线 834 */
  .rows { position: absolute; left: 744px; right: var(--m); top: 250px; height: 584px; }
  .row { position: absolute; left: 0; right: 0; height: 222px; padding-top: 28px; }
  .row .rule-h { left: 0; width: 100%; top: 0; }
  .row h2 {
    font-family: var(--font-giant); font-size: 112px; font-weight: 900; line-height: 1;
    letter-spacing: -0.01em; white-space: nowrap;
  }

  /* 底部：2px 黑线，左一栏职位，右三栏是试用期时间轴 */
  #rule-facts { left: var(--m); width: var(--content-w); top: 896px; }
  .facts {
    position: absolute; left: var(--m); width: var(--content-w); top: 898px; height: 134px;
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .facts .rule-v { top: 0; height: 134px; }
  .fact { padding: 16px 28px 0; position: relative; }
  .fact:first-child { padding-left: 0; }
  .fact .k { font-size: var(--fs-label); font-weight: 700; color: var(--muted); line-height: 1.2; }
  .fact .v { font-family: var(--font-giant); font-weight: 900; font-size: 60px; line-height: 1; margin-top: 6px; letter-spacing: -0.02em; white-space: nowrap; }
  .fact small { display: block; margin-top: 8px; font-size: var(--fs-label); line-height: 1.3; color: var(--ink-2); white-space: nowrap; }

  .term { grid-column: 2 / 5; }
  /* 时间轴：一格是整个试用期，蓝色是已经走过的部分（到 10-27 述职） */
  .axis { position: absolute; left: 28px; right: 0; top: 62px; height: 20px; }
  .axis .base { position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--cell); transform-origin: 0 50%; }
  .axis .done { position: absolute; left: 0; width: var(--at); top: 7px; height: 6px; background: var(--blue); transform-origin: 0 50%; }
  .axis .tick { position: absolute; top: 0; width: 2px; height: 20px; background: var(--ink); transform-origin: 50% 0; }
  .axis-lab { position: absolute; left: 28px; right: 0; top: 92px; height: 30px; font-size: var(--fs-body); line-height: 1.2; white-space: nowrap; }
  .axis-lab span { position: absolute; top: 0; }
  .axis-lab b { font-weight: 700; }
</style>
</head>

<script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
    var drawX = [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }];
    var drawY = [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }];
    var rise = [{ transform: 'translateY(135%)' }, { transform: 'none' }];

    // 1 页眉细线从左画到右
    P5.tween($('#rule-top'), drawX, { duration: 700 });

    // 2 巨数字像里程表一样滚到 3
    P5.tween($('.giant .strip'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-3em)' }],
      { delay: 60, duration: 1050, easing: 'cubic-bezier(.22,.8,.12,1)' });

    // 3 引子升起，三行的细线依次画出、字跟着升起
    P5.tween($('.lead .ln > span'), rise, { delay: 260, duration: 650 });
    P5.tween($('.lead img'), [{ opacity: 0 }, { opacity: 1 }], { delay: 360, duration: 600 });
    $$('.row').forEach(function (r, i) {
      P5.tween(r.querySelector('.rule-h'), drawX, { delay: 320 + i * 120, duration: 650 });
      P5.tween(r.querySelector('.ln > span'), rise, { delay: 380 + i * 120, duration: 750 });
    });

    // 4 底部黑线画出来，竖线落下；时间轴底线画出，蓝色走到述职日
    P5.tween($('#rule-facts'), drawX, { delay: 560, duration: 750 });
    $$('.facts .rule-v').forEach(function (v) { P5.tween(v, drawY, { delay: 720, duration: 550 }); });
    P5.tween($('.axis .base'), drawX, { delay: 760, duration: 600 });
    P5.tween($('.axis .done'), drawX, { delay: 900, duration: 650 });
    $$('.axis .tick').forEach(function (t, i) { P5.tween(t, drawY, { delay: 820 + i * 140, duration: 360 }); });

    P5.go();
  })();
</script>
