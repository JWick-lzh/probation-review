<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作反馈系统截图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=Inter+Tight:wght@700..900&family=Noto+Sans+SC:wght@400;700;900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=Inter+Tight:wght@700..900&family=Noto+Sans+SC:wght@400;700;900&display=swap"></noscript>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  /* 截图页骨架同第 5、6、9 页。左边工作反馈系统「提交情况」截图（1327×1045 偏竖，按原比例放 778 宽、高 613，和第 5 页截图同高，不裁），
     右栏巨数字 105（份双周汇报）+ 结论句，底部四栏是版本、发布和两次当天交付 */

  .runhead {
    position: absolute; left: var(--m); right: var(--m); top: 40px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: var(--fs-label); line-height: 1.2;
  }
  .runhead b { font-weight: 700; }
  #rule-top { left: var(--m); width: var(--content-w); top: 78px; }

  /* 截图：容器和原图同比例（1327×1045）；图注仍拉满 1080，和其他截图页的细线对齐 */
  .shot { position: absolute; left: var(--m); top: 118px; width: 778px; aspect-ratio: 1327 / 1045; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: contain; box-shadow: 0 0 0 1px var(--rule); }
  .cap { position: absolute; left: 0; width: 1080px; top: calc(100% + 15px); padding-top: 12px; font-size: var(--fs-label); line-height: 1.3; color: var(--muted); }
  .cap .rule-h { left: 0; width: 100%; top: 0; }

  /* 右栏 */
  .side { position: absolute; left: 1248px; width: 576px; top: 118px; }
  .side > .rule-h { left: 0; width: 100%; top: 0; }
  .side .k { padding-top: 14px; font-size: var(--fs-label); font-weight: 700; color: var(--muted); line-height: 1.2; }
  .giant {
    margin: 14px 0 0 -6px;
    font-family: var(--font-giant); font-weight: 900; line-height: 1;
    font-size: 176px; letter-spacing: -0.04em; white-space: nowrap;
  }
  .giant small { font-size: 0.5em; letter-spacing: -0.02em; margin-left: 0.03em; }
  .basis { margin-top: 16px; font-size: var(--fs-lead); font-weight: 700; line-height: 1.3; }
  .claim {
    margin-top: 40px;
    font-family: var(--font-giant); font-size: 60px; font-weight: 900;
    line-height: 1.12; letter-spacing: -0.01em;
  }
  .say { margin-top: 28px; font-size: var(--fs-body); line-height: 1.5; color: var(--ink-2); }

  /* 底部辅助数 */
  #rule-facts { left: var(--m); width: var(--content-w); top: 830px; }
  .facts {
    position: absolute; left: var(--m); width: var(--content-w); top: 832px; height: 140px;
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .facts .rule-v { top: 0; height: 140px; }
  .fact { padding: 16px 28px 0; position: relative; }
  .fact:first-child { padding-left: 0; }
  .fact .k { font-size: var(--fs-label); font-weight: 700; color: var(--muted); line-height: 1.2; }
  .fact .v { font-family: var(--font-giant); font-weight: 900; font-size: 60px; line-height: 1; margin-top: 6px; letter-spacing: -0.035em; white-space: nowrap; }
  .fact .v i { font-style: normal; font-family: var(--font-text); font-size: var(--fs-lead); font-weight: 700; letter-spacing: 0; margin-left: 6px; }
  .fact small { display: block; margin-top: 8px; font-size: var(--fs-label); line-height: 1.3; color: var(--ink-2); }

  .foot {
    position: absolute; left: var(--m); right: var(--m); top: 1000px;
    font-size: var(--fs-label); line-height: 1.2; color: var(--muted);
  }
</style>
</head>
<body>

  <div class="runhead"><b>三、工作目标完成情况</b><span>转正述职　林灶辉</span></div>
  <div class="rule-h strong" id="rule-top"></div>

  <figure class="shot">
    <img src="../assets/feedback-shot.png" alt="工作反馈系统「提交情况」页，第 2 期，截止 9 月 26 日 18:00：没交 0 人，迟交 3 人，下面是按部门的没交、迟交人数和提交名单；姓名和部门已打码">
    <figcaption class="cap"><span class="rule-h"></span>图：工作反馈系统「提交情况」页，第 2 期，姓名已打码（述职报告截图）</figcaption>
  </figure>

  <aside class="side">
    <div class="rule-h strong"></div>
    <p class="k">工作反馈系统</p>
    <div class="giant" role="img" aria-label="105 份">
      <span class="odo" aria-hidden="true"><span class="strip" style="--n:1"><b>0</b><b>1</b></span></span><span class="odo" aria-hidden="true"><span class="strip" style="--n:0"><b>0</b></span></span><span class="odo" aria-hidden="true"><span class="strip" style="--n:5"><b>0</b><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b></span></span><small aria-hidden="true">份</small>
    </div>
    <p class="basis">双周汇报 4 期，名单 26 人</p>
    <h1 class="claim">
      <span class="ln"><span>双周汇报：</span></span>
      <span class="ln"><span>4 期 105 份，</span></span>
      <span class="ln"><span>都在一个系统里</span></span>
    </h1>
  </aside>

  <div class="rule-h strong" id="rule-facts"></div>
  <section class="facts">
    <div class="fact">
      <p class="k">版本</p>
      <p class="v"><span data-to="20">20</span><i>个</i></p>
      <small>9/23 V1.0 到 10/24 V2.11</small>
    </div>
    <div class="fact">
      <div class="rule-v" style="left:0"></div>
      <p class="k">发布</p>
      <p class="v"><span data-to="135">135</span><i>次</i></p>
      <small>9/23–10/24</small>
    </div>
    <div class="fact">
      <div class="rule-v" style="left:0"></div>
      <p class="k">当天交付</p>
      <p class="v">10/22</p>
      <small>CEO 上午提筛选需求，下午交付</small>
    </div>
    <div class="fact">
      <div class="rule-v" style="left:0"></div>
      <p class="k">时间管理</p>
      <p class="v">10/19</p>
      <small>加了时间管理模块</small>
    </div>
  </section>

  <footer class="foot">口径：工作反馈系统线上库；版本取 git；截图取自述职报告</footer>

<script src="../shared/motion.js"></script>
<script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
    var drawX = [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }];
    var drawY = [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }];
    var rise = [{ transform: 'translateY(135%)' }, { transform: 'none' }];
    var fade = [{ opacity: 0 }, { opacity: 1 }];

    P5.tween($('#rule-top'), drawX, { duration: 700 });

    // 截图上浮，图注细线画出
    P5.tween($('.shot img'), [{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], { delay: 80, duration: 700 });
    P5.tween($('.cap .rule-h'), drawX, { delay: 300, duration: 600 });
    P5.tween($('.cap'), fade, { delay: 420, duration: 500 });

    // 右栏：细线 → 巨数字逐位滚到 105 → 口径 → 结论
    P5.tween($('.side > .rule-h'), drawX, { delay: 120, duration: 600 });
    $$('.giant .strip').forEach(function (s, i) {
      var n = parseFloat(s.style.getPropertyValue('--n'));
      P5.tween(s, [{ transform: 'translateY(0)' }, { transform: 'translateY(' + (-n) + 'em)' }],
        { delay: 120 + i * 80, duration: 1000 - i * 60, easing: 'cubic-bezier(.22,.8,.12,1)' });
    });
    P5.tween($('.giant small'), fade, { delay: 560, duration: 400 });
    P5.tween($('.basis'), fade, { delay: 520, duration: 500 });
    $$('.claim .ln > span').forEach(function (s, i) { P5.tween(s, rise, { delay: 440 + i * 80, duration: 750 }); });

    // 底部
    P5.tween($('#rule-facts'), drawX, { delay: 600, duration: 750 });
    $$('.facts .rule-v').forEach(function (v, i) { P5.tween(v, drawY, { delay: 760 + i * 60, duration: 500 }); });
    $$('.facts [data-to]').forEach(function (n, i) { P5.count(n, { delay: 760 + i * 60, duration: 650 }); });
    $$('.fact').forEach(function (f, i) { P5.tween(f, fade, { delay: 700 + i * 60, duration: 450 }); });

    P5.go();
  })();
</script>
</body>
</html>
