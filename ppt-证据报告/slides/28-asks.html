<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>结尾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap"></noscript>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/motion.js"></script>
<style>
/* 顶栏：logo 挪到右端，导航右移让出左上角（演示外壳的「概览」按钮在那里；与 01–07 同一写法） */
.bar nav { order: 1; margin-left: 58px; }
.bar .asof { order: 2; }
.bar .brand { order: 3; }
/* ── 28 结尾：只有一句话 ── */
.end { position: absolute; left: var(--gutter); right: var(--gutter); top: 110px; bottom: 0; display: flex; align-items: center; }
.end .quote { font-family: var(--serif); font-weight: 700; font-size: 136px; line-height: 1.2; letter-spacing: .06em; color: var(--ink); white-space: nowrap; }
html.motion .end .quote { animation: rise .7s var(--ease-out) .15s both; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand" role="img" aria-label="usmile"></div>
  <nav aria-label="章节"><span>岗位定位</span><span>目标回顾</span><span>完成情况</span><span>IT 规划</span><span>团队管理</span><span>自我评价</span><span>未来计划</span></nav>
  <span class="asof">数据截至 2026-10-26</span>
</header>
<div class="bar-rule" aria-hidden="true"></div>

<section class="end">
  <h1 class="quote">善战者无赫赫之功</h1>
</section>
</body>
</html>
