/* 顶栏：logo 挪到右端，导航右移让出左上角（演示外壳的「概览」按钮在那里；与 01–07 同一写法） */
.bar nav { order: 1; margin-left: 58px; }
.bar .asof { order: 2; }
.bar .brand { order: 3; }
/* ── 15 指标以外 ── */
.band { height: 186px; padding-top: 34px; }
.band .assert { font-size: var(--fs-assert); line-height: 1.2; white-space: nowrap; }
.band .sub { margin-top: 6px; font-size: var(--fs-body); color: var(--ink-2); }

.chart { position: absolute; left: var(--gutter); top: 312px; width: 1240px; }
.plot { display: block; overflow: visible; }
.chart .source { margin-top: 18px; }

.plot .lg { font-size: 22px; fill: var(--ink-2); }
.plot .ax { font-size: 20px; fill: var(--muted); }
.plot .goal { font-size: 26px; font-weight: 700; fill: var(--ink); }
.plot .weight { font-size: 20px; fill: var(--muted); }
.plot .val { font-size: 24px; font-weight: 700; fill: var(--ink);
  paint-order: stroke; stroke: #fff; stroke-width: 10px; stroke-linejoin: round; }
.plot .big { font-size: 26px; font-weight: 700; fill: var(--ink); }
.plot .sep { stroke: var(--track); stroke-width: 1.5; }
.plot .track { stroke: var(--track); stroke-width: 2; }
.plot .grid { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 6; fill: none; }
.plot .cut { stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
.plot .dot { fill: var(--s-done); stroke: #fff; stroke-width: 3; }
.plot .cell.mine { fill: var(--s-done); }
.plot .cell.other { fill: #fff; stroke: #8E9AA8; stroke-width: 2; }

.side.read { left: 1400px; top: 322px; width: 414px; }
.side.read h3 + p { margin-top: 10px; }
.side.read p + p { margin-top: 14px; }
.side.read p + h3 { margin-top: 44px; }

/* 时间轴（ms）：红线 0–600 → 标题 100–600 → 框架 250–650 → 月份线 350–800
   → 产出按日期先后落点 450–1180 → 79 格逐格出现 520–1500 → 来源行 1300–1600 */
.plot .pop { transform-box: fill-box; transform-origin: 50% 50%; }
.plot .grid, .plot .cut { transform-box: fill-box; transform-origin: 50% 0; }
html.motion .band .assert { animation: rise .5s var(--ease-out) .1s both; }
html.motion .band .sub { animation: rise .5s var(--ease-out) .2s both; }
html.motion .plot .frame { animation: fade .4s ease-out .25s both; }
html.motion .plot .grid, html.motion .plot .cut { animation: draw-y .45s var(--ease-out) .35s both; }
html.motion .plot .pop { animation: pop .28s var(--ease-out) var(--d) both; }
html.motion .plot .ride { animation: ride .3s var(--ease-out) var(--d) both; }
html.motion .side.read { animation: fade .4s ease-out .3s both; }
.chart .source { --src-delay: 1.3s; }
</style>
