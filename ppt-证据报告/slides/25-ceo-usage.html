<link rel="stylesheet" href="../shared/tokens.css">

<style>
/* 顶栏：logo 挪到右端，导航右移让出左上角（演示外壳的「概览」按钮在那里；与 01–07 同一写法） */
.bar nav { order: 1; margin-left: 58px; }
.bar .asof { order: 2; }
.bar .brand { order: 3; }
/* ── 25 CEO 的实际使用 ── */
.band { height: 186px; padding-top: 34px; }
.band .assert { font-size: var(--fs-assert); line-height: 1.2; white-space: nowrap; }
.band .sub { margin-top: 6px; font-size: var(--fs-body); color: var(--ink-2); }

.chart { position: absolute; left: var(--gutter); top: 312px; width: 1240px; }
.plot { display: block; overflow: visible; }
.chart .source { margin-top: 18px; }

.plot .lg { font-size: 22px; fill: var(--ink-2); }
.plot .ax { font-size: 20px; fill: var(--muted); }
.plot .app { font-size: 28px; font-weight: 700; fill: var(--ink); }
.plot .cnt { font-size: 24px; fill: var(--ink-2); }
.plot .cnt-b { font-weight: 700; fill: var(--ink); }
.plot .ann { font-size: 20px; font-weight: 500; fill: var(--ink-2); }
.plot .ann-b { font-size: 22px; font-weight: 700; fill: var(--ink); }
.plot .bad { font-size: 24px; font-weight: 700; fill: var(--red); }
.plot .week { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 6; fill: none; }
.plot .sep { stroke: var(--track); stroke-width: 1.5; }
.plot .on { fill: var(--s-done); stroke: #fff; stroke-width: 3; }
.plot .off { fill: #B8C2CE; }
.plot .none { stroke: #8E9AA8; stroke-width: 2; stroke-dasharray: 6 6; }
.plot .flag { stroke: var(--ink-2); stroke-width: 2; }
.plot .gap { stroke: var(--red); stroke-width: 3; }

.side.read { left: 1400px; top: 322px; width: 414px; }
.side.read h3 + p { margin-top: 10px; }
.side.read p + p { margin-top: 14px; }
.side.read p + h3 { margin-top: 44px; }
.side .verdict { font-weight: 700; color: var(--ink); }

/* 时间轴（ms）：红线 0–600 → 标题 100–700 → 框架 250–650 → 周线 350–800
   → 每天的小点从左到右排开 400–1220 → 打开的日子变成大点 800–1380 → 注释 1000–1400 → 来源行 1300–1600 */
.plot .pop { transform-box: fill-box; transform-origin: 50% 50%; }
.plot .week { transform-box: fill-box; transform-origin: 50% 0; }
.plot .gap { transform-box: fill-box; transform-origin: 0 50%; }
html.motion .band .assert { animation: rise .5s var(--ease-out) .1s both; }
html.motion .band .sub { animation: rise .5s var(--ease-out) .2s both; }
html.motion .plot .frame { animation: fade .4s ease-out .25s both; }
html.motion .plot .week { animation: draw-y .45s var(--ease-out) .35s both; }
html.motion .plot .pop { animation: pop .28s var(--ease-out) var(--d) both; }
html.motion .plot .gap { animation: draw-x .45s var(--ease-draw) 1s both; }
html.motion .plot .late { animation: fade .3s ease-out var(--d) both; }
html.motion .side.read { animation: fade .4s ease-out .3s both; }
.chart .source { --src-delay: 1.3s; }
</style>
</head>
