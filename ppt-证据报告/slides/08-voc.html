<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>G1 VOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap"></noscript>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/motion.js"></script>
<style>
/* 顶栏：logo 挪到右端，导航右移让出左上角（演示外壳的「概览」按钮在那里） */
.bar nav { order: 1; margin-left: 58px; }
.bar .asof { order: 2; }
.bar .brand { order: 3; }
/* 「≥」在 Noto Sans SC / PingFang SC 下会画成斜的「⩾」 */
.ge { font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif; }

/* ── 08 VOC ── */
.band { height: 186px; padding-top: 34px; }
.band .assert { font-size: var(--fs-assert); line-height: 1.2; }
.band .sub { margin-top: 6px; font-size: var(--fs-body); color: var(--ink-2); }

.chart { position: absolute; left: var(--gutter); top: 318px; width: 1240px; }
.plot { display: block; overflow: visible; }
.chart .source { margin-top: 14px; }

.plot .hd { font-size: 26px; font-weight: 700; fill: var(--ink); }
.plot .hd-v { font-size: 26px; font-weight: 700; fill: var(--ink); }
.plot .slot-on { fill: var(--s-done); }
.plot .slot-test { fill: #fff; stroke: var(--s-wip); stroke-width: 2.5; stroke-dasharray: 9 7; }
.plot .slot-none { fill: #fff; stroke: #C5CDD7; stroke-width: 2.5; stroke-dasharray: 9 7; }
.plot .tag { font-size: var(--fs-label); font-weight: 700; letter-spacing: .06em; }
.plot .nm { font-size: 30px; font-weight: 700; }
.plot .dt { font-size: var(--fs-body); }
.plot .on-navy { fill: #fff; }
.plot .on-navy-2 { fill: var(--on-navy); }
.plot .ink { fill: var(--ink); }
.plot .ink2 { fill: var(--ink-2); }
.plot .mut { fill: var(--muted); }

.plot .kr { font-size: var(--fs-body); fill: var(--ink-2); }
.plot .ev { font-size: var(--fs-body); fill: var(--muted); }
.plot .ax { font-size: var(--fs-label); fill: var(--muted); }
.plot .ax-b { font-weight: 700; fill: var(--ink-2); }
.plot .track { stroke: var(--track); stroke-width: 2; }
.plot .g0 { stroke: #B8C2CE; stroke-width: 2; }
.plot .g100 { stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 7 6; }
.plot .dot { stroke: #fff; stroke-width: 3; fill: var(--s-wip); }
.plot .val { font-size: var(--fs-body); font-weight: 700; fill: var(--ink);
  paint-order: stroke; stroke: #fff; stroke-width: 10px; stroke-linejoin: round; }
.plot .sep { stroke: var(--rule); stroke-width: 1.5; }

.side.src { left: 1400px; top: 328px; width: 414px; }
.side.src h3 + svg { margin-top: 14px; display: block; }
.side.src .lg { margin-top: 10px; }
.side.src .lg p { display: flex; align-items: center; gap: 12px; }
.side.src .lg i { flex: none; width: 18px; height: 18px; }
.side.src .ref { margin-top: 10px; font-size: var(--fs-label); color: var(--muted); }
.side.src h3.next { margin-top: 44px; }
.side.src h3.next + p { margin-top: 10px; }

/* 时间轴（ms）：红线 0–600 → 标题 100–700 → 框架 250–650 → 三个场景格依次 400–900
   → 两条进度依次画出 700–1300 → 侧栏 300–700、7 个渠道逐个出现 500–900 → 来源行 1300–1600 */
.plot .slot { transform-box: fill-box; }
.plot .bar-fill { transform-box: fill-box; transform-origin: 0 50%; }
.plot .pop, .side.src .pop { transform-box: fill-box; transform-origin: 50% 50%; }
.plot .grid { transform-box: fill-box; transform-origin: 50% 0; }
html.motion .band .assert { animation: rise .5s var(--ease-out) .1s both; }
html.motion .band .sub { animation: rise .5s var(--ease-out) .2s both; }
html.motion .plot .frame { animation: fade .4s ease-out .25s both; }
html.motion .plot .slot { animation: rise .45s var(--ease-out) var(--d) both; }
html.motion .plot .grid { animation: draw-y .4s var(--ease-out) .6s both; }
html.motion .plot .pop { animation: pop .28s var(--ease-out) var(--d) both; }
html.motion .plot .bar-fill { animation: draw-x .52s var(--ease-out) var(--d) both; }
html.motion .plot .ride { animation: ride .52s var(--ease-out) var(--d) both; }
html.motion .side.src { animation: fade .4s ease-out .3s both; }
html.motion .side.src .pop { animation: pop .28s var(--ease-out) var(--d) both; }
.chart .source { --src-delay: 1.3s; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand" role="img" aria-label="usmile"></div>
  <nav aria-label="章节"><span>岗位定位</span><span>目标回顾</span><span class="on" aria-current="true">完成情况</span><span>IT 规划</span><span>团队管理</span><span>自我评价</span><span>未来计划</span></nav>
  <span class="asof">数据截至 2026-10-26</span>
</header>
<div class="bar-rule" aria-hidden="true"></div>

<section class="band">
  <h1 class="assert">VOC 上线了，业务场景只有 1 个在用</h1>
  <p class="sub">权重 40%，最高的一项；3 项指标都还在进行中</p>
</section>

<figure class="chart">
  <svg class="plot" width="1240" height="612" viewBox="0 0 1240 612" role="img"
       aria-label="VOC 三项指标：至少 3 个场景在用，现在 1 / 3，Y30 诊断看板 9/21 交给业务在用，竞品对比 9/24 发出还在测试环境，第 3 个还没有；核心能力上线 90%；至少 1 轮优化 80%">
    <g class="frame">
      <text x="0" y="28" class="hd"><tspan class="ge">≥</tspan>3 个场景在用</text>
      <text x="1240" y="28" class="hd-v" text-anchor="end">现在 1 / 3</text>
    </g>

    <g class="slot" style="--d:400ms">
      <rect x="0" y="54" width="390" height="190" class="slot-on"/>
      <text x="28" y="96" class="tag on-navy-2">在用</text>
      <text x="28" y="146" class="nm on-navy">Y30 诊断看板</text>
      <text x="28" y="196" class="dt on-navy">9/21 交给业务（吴程程）</text>
    </g>
    <g class="slot" style="--d:520ms">
      <rect x="425" y="54" width="390" height="190" class="slot-test"/>
      <text x="453" y="96" class="tag mut">还在测试环境</text>
      <text x="453" y="146" class="nm ink">竞品对比</text>
      <text x="453" y="196" class="dt ink2">9/24 发出</text>
    </g>
    <g class="slot" style="--d:640ms">
      <rect x="850" y="54" width="390" height="190" class="slot-none"/>
      <text x="878" y="96" class="tag mut">还没有</text>
      <text x="878" y="146" class="nm mut">第 3 个场景</text>
      <text x="878" y="196" class="dt mut">补到 3 个是计划，日期待定</text>
    </g>

    <g class="frame">
      <line x1="0" x2="1240" y1="290" y2="290" class="sep"/>
      <text x="420" y="336" class="ax" text-anchor="middle">0</text>
      <text x="1140" y="336" class="ax" text-anchor="middle"><tspan class="ax-b">基线</tspan> 100%</text>
      <text x="0" y="398" class="kr">核心能力上线</text>
      <line x1="420" x2="1140" y1="390" y2="390" class="track"/>
      <text x="0" y="444" class="ev">8/11 V1.0 上线生产，共 12 次生产部署；10/21 V2.0 瘦身；10/23 矩阵判定规则改成界面可调</text>
      <text x="0" y="530" class="kr"><tspan class="ge">≥</tspan>1 轮优化</text>
      <line x1="420" x2="1140" y1="522" y2="522" class="track"/>
      <text x="0" y="576" class="ev">换掉 3 个指标维度、清旧数据重跑、补「防水」标签、阈值可调</text>
    </g>
    <!-- 刻度只画在进度条那一段，不穿过下面的证据行 -->
    <line x1="420" x2="420" y1="354" y2="410" class="grid g0"/>
    <line x1="1140" x2="1140" y1="354" y2="410" class="grid g100"/>
    <line x1="420" x2="420" y1="500" y2="544" class="grid g0"/>
    <line x1="1140" x2="1140" y1="500" y2="544" class="grid g100"/>

    <rect x="420" y="387" width="648" height="6" rx="3" class="bar-fill" style="--d:700ms;fill:var(--s-wip)"/>
    <g class="ride" data-ride style="--dx:648px;--d:700ms"><circle cx="1068" cy="390" r="12" class="pop dot" style="--d:700ms"/><text x="1092" y="399" class="val"><tspan data-count="90" data-fmt="{}%">90%</tspan></text></g>
    <rect x="420" y="519" width="576" height="6" rx="3" class="bar-fill" style="--d:800ms;fill:var(--s-wip)"/>
    <g class="ride" data-ride style="--dx:576px;--d:800ms"><circle cx="996" cy="522" r="12" class="pop dot" style="--d:800ms"/><text x="1020" y="531" class="val"><tspan data-count="80" data-fmt="{}%">80%</tspan></text></g>
  </svg>
  <figcaption class="source">来源：完成度取试用期目标跟踪表 9-30 版；部署次数取 VOC 生产部署记录</figcaption>
</figure>

<aside class="side src">
  <h3>数据源：7 个渠道</h3>
  <svg width="414" height="44" viewBox="0 0 414 44" role="img" aria-label="7 个渠道：4 个打通，亚马逊靠 RPA 部分打通，2 个没打通">
    <rect x="2" y="2" width="40" height="40" class="pop" style="--d:500ms;fill:var(--s-done)"/>
    <rect x="54" y="2" width="40" height="40" class="pop" style="--d:550ms;fill:var(--s-done)"/>
    <rect x="106" y="2" width="40" height="40" class="pop" style="--d:600ms;fill:var(--s-done)"/>
    <rect x="158" y="2" width="40" height="40" class="pop" style="--d:650ms;fill:var(--s-done)"/>
    <rect x="210" y="2" width="40" height="40" class="pop" style="--d:700ms;fill:var(--s-wip)"/>
    <rect x="263.5" y="3.5" width="37" height="37" class="pop" style="--d:750ms;fill:#fff;stroke:var(--red);stroke-width:3"/>
    <rect x="315.5" y="3.5" width="37" height="37" class="pop" style="--d:800ms;fill:#fff;stroke:var(--red);stroke-width:3"/>
  </svg>
  <div class="lg">
    <p><i style="background:var(--s-done)"></i>打通 4 个</p>
    <p><i style="background:var(--s-wip)"></i>亚马逊靠 RPA 部分打通</p>
    <p><i style="border:3px solid var(--red)"></i>没打通 2 个</p>
  </div>
  <p class="ref">来源：10/10《Voc数据打通确认》</p>
  <h3 class="next">接下来（计划）</h3>
  <p>11/8 正式上线；<br>场景补到 3 个，日期待定。</p>
</aside>
</body>
</html>
