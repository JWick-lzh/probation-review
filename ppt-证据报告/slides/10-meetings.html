<style>
/* 顶栏：logo 挪到右端，导航右移让出左上角（演示外壳的「概览」按钮在那里） */
.bar nav { order: 1; margin-left: 58px; }
.bar .asof { order: 2; }
.bar .brand { order: 3; }
/* 「≥」在 Noto Sans SC / PingFang SC 下会画成斜的「⩾」 */
.ge { font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif; }

/* ── 10 会议：635 个点，一个点一场会 ── */
.band { height: 186px; padding-top: 34px; }
.band .assert { font-size: var(--fs-assert); line-height: 1.2; }
.band .sub { margin-top: 6px; font-size: var(--fs-body); color: var(--ink-2); }

.chart { position: absolute; left: var(--gutter); top: 318px; width: 1240px; }
.plot { display: block; overflow: visible; }
.chart .source { margin-top: 14px; }
.plot .ct { font-size: 26px; font-weight: 700; fill: var(--ink); }
.plot .lg { font-size: var(--fs-body); fill: var(--ink-2); }
.plot .lg-n { font-size: 28px; font-weight: 700; fill: var(--ink); }
.plot .m-on { fill: var(--s-done); }
.plot .m-rest { fill: #C5CDD7; }

.side.notes { left: 1400px; top: 328px; width: 414px; }
.side.notes h3 + p { margin-top: 10px; }
.side.notes p + h3 { margin-top: 44px; }

/* 时间轴（ms）：红线 0–600 → 标题 100–700 → 框架和灰点 250–650
   → 有星级的 355 个点按行填进来 450–1350 → 侧栏 300–700 → 来源行 1300–1600 */
html.motion .band .assert { animation: rise .5s var(--ease-out) .1s both; }
html.motion .band .sub { animation: rise .5s var(--ease-out) .2s both; }
html.motion .plot .frame, html.motion .plot .m-rest { animation: fade .4s ease-out .25s both; }
html.motion .plot .m-on { animation: fade .3s ease-out var(--d) both; }
html.motion .side.notes { animation: fade .4s ease-out .3s both; }
.chart .source { --src-delay: 1.3s; }
</style>
</head>
